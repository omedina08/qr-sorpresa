
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Sorpresa</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, sans-serif;
      text-align: center;
      color: #352546;
      background: linear-gradient(135deg, #fff1f7, #eeeaff);
      min-height: 100vh;
      box-sizing: border-box;
    }
    main {
      max-width: 560px;
      margin: 50px auto;
      padding: 32px 20px;
      background: white;
      border-radius: 24px;
      box-shadow: 0 8px 30px #62408018;
    }
    h1 { color: #8b4bc0; }
    .icon { font-size: 54px; }
    p { line-height: 1.7; }
    .button {
      display: inline-block;
      margin-top: 14px;
      padding: 14px 22px;
      border-radius: 14px;
      color: white;
      background: #d84c91;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <main>
    <div class="icon">🎁 💖 🎈</div>
    <h1>QR Sorpresa</h1>
    <p>Pequeños detalles, recuerdos inolvidables.</p>
    <p>
      Muy pronto podrás crear páginas personalizadas
      con fotografías, mensajes especiales y sorpresas
      interactivas para las personas que más quieres.
    </p>
    <a class="button" href="mailto:">
      ¡Prepara una sorpresa!
    </a>
  </main>
</body>
</html>
